{{- if .Values.rbacScoper.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "odh-observability.fullname" . }}-rbac-scoper
  namespace: {{ .Values.operatorNamespace }}
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
    security.opendatahub.io/rbac-scoper: protected
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "odh-observability.fullname" . }}-rbac-scoper
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: ["services.platform.opendatahub.io"]
    resources: ["monitorings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["services.platform.opendatahub.io"]
    resources: ["monitorings/finalizers"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["data-science-collector-targetallocator-secrets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["data-science-collector-targetallocator-secrets-binding"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames:
      - data-science-cluster-log-forwarder-collector-collect-app-logs
      - data-science-cluster-log-forwarder-collector-loki-writer
      - data-science-collector-mlflow-trace-export
      - data-science-collector-tempo-trace-export
      - data-science-monitoringstack-alertmanager-prometheus-metrics-reader
      - data-science-usage-logs-processor
      - generate-processors-collector-rolebinding
      - generate-processors-targetallocator-discovery-rolebinding
      - generate-processors-targetallocator-rolebinding
      - korrel8r-auth-delegator
      - korrel8r-query
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "odh-observability.fullname" . }}-rbac-scoper
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
    security.opendatahub.io/rbac-scoper: protected
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "odh-observability.fullname" . }}-rbac-scoper
subjects:
  - kind: ServiceAccount
    name: {{ include "odh-observability.fullname" . }}-rbac-scoper
    namespace: {{ .Values.operatorNamespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odh-observability.fullname" . }}-rbac-scoper
  namespace: {{ .Values.operatorNamespace }}
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac-scoper
    security.opendatahub.io/rbac-scoper: protected
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "odh-observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rbac-scoper
  template:
    metadata:
      labels:
        {{- include "odh-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rbac-scoper
        security.opendatahub.io/rbac-scoper: protected
    spec:
      serviceAccountName: {{ include "odh-observability.fullname" . }}-rbac-scoper
      securityContext:
        runAsNonRoot: true
      containers:
        - name: scoper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=rbac-scoper
            - --metrics-bind-address=:0
            - --health-probe-bind-address=:8082
            - --leader-elect={{ .Values.leaderElect }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rbacScoper.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
{{- end }}
