{{- if .Values.rbacScoper.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: generate-processors-role
  labels:
    operator-rbac-toolkit.io/permission-ceiling: "true"
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: ["", "config.openshift.io"]
    resources: ["pods", "namespaces", "infrastructures", "infrastructures/status", "services", "endpoints"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors", "probes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: generate-processors-targetallocator-role
  labels:
    operator-rbac-toolkit.io/permission-ceiling: "true"
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/metrics", "services", "endpoints"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors", "scrapeconfigs"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["probes"]
    verbs: ["get", "watch", "list"]
  - nonResourceURLs: ["/metrics", "/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-science-collector-mlflow-trace-export
  labels:
    operator-rbac-toolkit.io/permission-ceiling: "true"
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-science-collector-tempo-trace-export
  labels:
    operator-rbac-toolkit.io/permission-ceiling: "true"
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["{{ include "odh-observability.monitoringNamespace" . }}"]
    resourceNames: ["traces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: korrel8r-query
  labels:
    operator-rbac-toolkit.io/permission-ceiling: "true"
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events", "replicationcontrollers", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["application"]
    resourceNames: ["logs"]
    verbs: ["get"]
  - apiGroups: ["tempo.grafana.com"]
    resources: ["{{ include "odh-observability.monitoringNamespace" . }}"]
    resourceNames: ["traces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-science-usage-logs-processor
  labels:
    operator-rbac-toolkit.io/permission-ceiling: "true"
    security.opendatahub.io/rbac-scoper: protected
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["application"]
    resourceNames: ["logs"]
    verbs: ["create"]
{{- end }}
