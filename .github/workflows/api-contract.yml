name: API contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Baseline: 1d9fc9d9123095561c5d3fedf97c0293fd841a09 from refs/heads/main,
# the latest upstream/main head used to prepare this pull request (2026-11-13).
# Moving this baseline requires approval from someone other than the author.
# The reusable workflows intentionally follow the central repository's latest
# release as required by the onboarding issue.
jobs:
  crd-monitoring:
    name: CRD compatibility (Monitoring)
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: charts/odh-observability/crds/*.yaml
      baseline-refs: 1d9fc9d9123095561c5d3fedf97c0293fd841a09
      mode: enforce

  api-contract-coverage:
    name: API contract coverage
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      crd-globs: charts/odh-observability/crds/*.yaml
      baseline-refs: 1d9fc9d9123095561c5d3fedf97c0293fd841a09
      mode: enforce
      yq-version: "4.45.1"
