apiVersion: dscinitialization.opendatahub.io/v2
kind: DSCInitialization
metadata:
  name: default-dsci
spec:
  applicationsNamespace: redhat-ods-applications
  monitoring:
    managementState: Managed
    metrics:
      storage:
        size: 5Gi
      exporters:
        otlp/metrics:
          endpoint: "http://lgtm.redhat-ods-monitoring.svc.cluster.local:4317"
          tls:
            insecure: true
    traces:
      storage:
        backend: pv
        size: 5Gi
      exporters:
        otlp/traces:
          endpoint: "http://lgtm.redhat-ods-monitoring.svc.cluster.local:4317"
          tls:
            insecure: true
    usageLogs:
      storage:
        type: s3
        secretName: loki-s3-secret
        credentialMode: static
        storageClassName: gp3-csi
    namespace: redhat-ods-monitoring
  trustedCABundle:
    customCABundle: ""
    managementState: Managed
