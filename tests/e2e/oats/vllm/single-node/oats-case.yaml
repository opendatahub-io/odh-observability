name: single-node topology llmisvc
tags: ["e2e", "vllm", "single-node"]

fixture:
  remote:
    endpoint: default

expected:
  metrics:
    # expected vLLM metrics for single-node llmisvc tests
    - promql: 'vllm:prompt_tokens_total{llm_isvc_name=~".*single-node.*"}'
      value: ">= 0"
    - promql: 'vllm:generation_tokens_total{llm_isvc_name=~".*single-node.*"}'
      value: ">= 0"
    - promql: 'vllm:time_to_first_token_seconds_bucket{llm_isvc_name=~".*single-node.*"}'
      value: ">= 0"
    - promql: 'vllm:e2e_request_latency_seconds_bucket{llm_isvc_name=~".*single-node.*"}'
      value: ">= 0"

    # Ensure non-bucket vLLM metrics stay below the per-metric series budget.
    - promql: 'max by (__name__) (count by (__name__) ({__name__=~"vllm:.*|vllm_.*",__name__!~".*_bucket",llm_isvc_name=~".*single-node.*"}))'
      value: "<= 20"
    # Histogram buckets have a larger budget to accommodate their bucket boundaries and labels.
    - promql: 'max by (__name__) (count by (__name__) ({__name__=~"vllm:.*|vllm_.*",__name__=~".*_bucket",llm_isvc_name=~".*single-node.*"}))'
      value: "<= 50"
