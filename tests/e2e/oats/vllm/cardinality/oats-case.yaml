name: vLLM Metric Cardinality Validation
tags: ["cardinality", "vllm"]

fixture:
  remote:
    endpoint: default

expected:
  metrics:
    # Ensure no vLLM metric produces more than 20 time series per metric name
    - promql: 'max by (__name__) (count by (__name__) ({__name__=~"vllm:.*|vllm_.*"}))'
      value: "<= 20"
