apiVersion: monitoring.rhobs/v1
kind: PrometheusRule
metadata:
  name: operator-prometheusrules
  namespace: {{.Namespace}}
spec:
  groups:
      - name: Operator Pod Health
        interval: 1m
        rules:
        - alert: OperatorPodRestartingFrequently
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="{{ .OperatorNamespace }}",
              pod=~"{{ .OperatorPodPrefix }}.*"
            }[5m]) > 3
          for: 2m
          labels:
            severity: warning
            namespace: "{{ .OperatorNamespace }}"
          annotations:
            summary: "Operator pod {{`{{`}} $labels.pod {{`}}`}} is restarting frequently"
            description: "Pod {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} has restarted {{`{{`}} $value {{`}}`}} times in the last 5 minutes. This indicates potential instability."
            message: "Container {{`{{`}} $labels.container {{`}}`}} in pod {{`{{`}} $labels.pod {{`}}`}} (namespace: {{`{{`}} $labels.namespace {{`}}`}}) has been restarted more than 3 times in a 5-minute period."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#operator-pod-restarting-frequently"

      - name: Scrape Target Health
        interval: 1m
        rules:
        - alert: PrometheusSelfScrapeTargetDown
          expr: |
            absent(up{job="prometheus-self-fixed"}) or up{job="prometheus-self-fixed"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Data Science Prometheus is not scraping itself"
            description: "The prometheus-self-fixed target (Prometheus self-monitoring) has been down for more than 10 minutes. Prometheus health cannot be verified, and dependent SLO alerts may be silently broken."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#prometheus-self-scrape-target-down"

        - alert: CollectorTelemetryScrapeTargetDown
          expr: |
            absent(up{job="data-science-collector-monitor"}) or up{job="data-science-collector-monitor"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenTelemetry Collector telemetry scrape target is down"
            description: "The data-science-collector-monitor target has been down for more than 10 minutes. Collector health metrics are not being collected."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#collector-telemetry--prometheus-exporter-scrape-target-down"

        - alert: CollectorPrometheusExporterScrapeTargetDown
          expr: |
            absent(up{job="data-science-prometheus-monitor"}) or up{job="data-science-prometheus-monitor"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenTelemetry Collector Prometheus exporter scrape target is down"
            description: "The data-science-prometheus-monitor target has been down for more than 10 minutes. Application metrics forwarded through the collector are not being collected."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#collector-telemetry--prometheus-exporter-scrape-target-down"

        - alert: AlertmanagerSelfScrapeTargetDown
          expr: |
            absent(up{job="alertmanager-self"}) or up{job="alertmanager-self"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Data Science Alertmanager self-monitoring scrape target is down"
            description: "The alertmanager-self target has been down for more than 10 minutes. Alertmanager health cannot be verified, which may mask alert delivery failures."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#alertmanager-self-scrape-target-down"
      
      - name: Webhook Health
        interval: 1m
        rules:
        - alert: MonitoringOperatorPodUnavailable
          expr: |
            absent(kube_pod_status_ready{
              namespace="{{ .OperatorNamespace }}",
              pod=~"{{ .OperatorPodPrefix }}.*",
              condition="true"
            } == 1)
          for: 5m
          labels:
            severity: critical
            namespace: "{{ .OperatorNamespace }}"
          annotations:
            summary: "Monitoring operator pod is unavailable"
            description: "No ready operator pod in {{ .OperatorNamespace }} for 5 minutes. Webhook unavailable. Impact: failurePolicy=Ignore (default) admits monitors without scrape label (not scraped); Fail blocks admission."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#monitoring-operator-pod-unavailable"

        - alert: MonitoringWebhookAdmissionErrors
          expr: |
            rate(controller_runtime_webhook_requests_total{
              code="500"
            }[5m]) > 0
          for: 2m
          labels:
            severity: warning
            namespace: "{{ .OperatorNamespace }}"
          annotations:
            summary: "Monitoring webhook is experiencing admission errors"
            description: "The label-injection webhook is returning errors for ServiceMonitor/PodMonitor admission requests in {{ .OperatorNamespace }}. Some monitors may be admitted without labels and will not be scraped."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#monitoring-webhook-admission-errors"

        - alert: MonitoringWebhookAdmissionPathDown
          expr: |
            # Black-box check: webhook-health-probe PodMonitor exists but webhook has not
            # successfully processed any admission requests in 10 minutes. This indicates
            # webhook Service, TLS cert, MutatingWebhookConfiguration, or endpoint is broken.
            # NOTE: This is a one-time canary probe, not periodic. It detects initial setup
            # failures but may not catch later issues (e.g., TLS cert expiry) without new
            # admission requests.
            kube_podmonitor_created{
              namespace="{{ .Namespace }}",
              podmonitor="webhook-health-probe"
            }
            and on()
            (
              absent(controller_runtime_webhook_requests_total{
                code=~"2.."
              })
              or
              increase(controller_runtime_webhook_requests_total{
                code=~"2.."
              }[10m]) == 0
            )
          for: 5m
          labels:
            severity: critical
            namespace: "{{ .OperatorNamespace }}"
          annotations:
            summary: "Webhook admission path is down"
            description: "No webhook requests in 10m. Check Service, TLS cert, MutatingWebhookConfiguration. Impact: Ignore=monitors not scraped; Fail=admission blocked."
            triage: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/docs/troubleshooting.md#monitoring-webhook-admission-path-down"