apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: data-science-tempo-route
  namespace: {{.Namespace}}
  labels:
    app.kubernetes.io/name: tempo
    platform.opendatahub.io/part-of: monitoring
spec:
  to:
    kind: Service
    name: {{.TempoGatewayService}}
    weight: 100
  port:
    targetPort: public
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
