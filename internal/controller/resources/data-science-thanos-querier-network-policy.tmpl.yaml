apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-thanos-querier-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ThanosQuerier
      app.kubernetes.io/managed-by: observability-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The COO-created ServiceMonitor scrapes Querier metrics on this port.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
        - podSelector:
            matchLabels:
              instance: data-science-perses
              app.kubernetes.io/name: data-science-perses
        - podSelector:
            matchLabels:
              app: data-science-thanos-querier-proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: korrel8r
              app.kubernetes.io/component: correlation
              app.kubernetes.io/part-of: monitoring
      ports:
        - protocol: TCP
          port: 10902
