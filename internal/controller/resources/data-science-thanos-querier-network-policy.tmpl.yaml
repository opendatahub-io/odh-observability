apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-thanos-querier-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ThanosQuerier
      app.kubernetes.io/managed-by: observability-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # The COO-created ServiceMonitor scrapes Querier metrics on this port.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
        # Perses must not reach :10902 directly — force queries through
        # data-science-thanos-querier-proxy:8443 (namespace gate lives there).
        - podSelector:
            matchLabels:
              app: data-science-thanos-querier-proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: korrel8r
              app.kubernetes.io/component: correlation
              app.kubernetes.io/part-of: monitoring
      ports:
        - protocol: TCP
          port: 10902
  egress:
    # Querier resolves the Prometheus sidecar service through cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # Querier reads the Prometheus Thanos sidecar on TCP/10901.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
      ports:
        - protocol: TCP
          port: 10901
