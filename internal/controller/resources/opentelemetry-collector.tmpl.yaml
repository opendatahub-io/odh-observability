apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: data-science-collector
  namespace: {{.Namespace}}
spec:
  replicas: {{.CollectorReplicas}}
  mode: statefulset
  # NetworkPolicy ownership stays with this module so the OpenTelemetry
  # Operator cannot add an unrestricted ingress policy for the collector or
  # TargetAllocator.
  networkPolicy:
    enabled: false
  {{- if .Metrics }}
  targetAllocator:
    enabled: true
    serviceAccount: {{.TargetAllocatorServiceAccount}}
    mtls:
      enabled: true
      useCertManager: true
    # Auth secrets must only be transferred over the mTLS connection.
    allowInsecureAuthSecrets: false
    prometheusCR:
      enabled: true
      denyFSAccessThroughSMs: true
      secretNamespaces:
      {{ range .TargetAllocatorSecretNamespaces }}
        - {{ . }}
      {{ end }}
      podMonitorSelector:
        matchLabels:
          monitoring.opendatahub.io/scrape: "true"
      serviceMonitorSelector:
        matchLabels:
          monitoring.opendatahub.io/scrape: "true"
  {{- end }}
  resources:
    limits:
      cpu: {{.CollectorCPULimit}}
      memory: {{.CollectorMemoryLimit}}
    requests:
      cpu: {{.CollectorCPURequest}}
      memory: {{.CollectorMemoryRequest}}
  volumeMounts:
  - name: monitoring-tls-certs
    mountPath: /etc/otel-collector/monitoring-tls
    readOnly: true
  - name: otlp-tls-certs
    mountPath: /etc/otel-collector/otlp-tls
    readOnly: true
  {{- if .MetricsStorage }}
  - name: tls-certs
    mountPath: /etc/otel-collector/tls
    readOnly: true
  {{- end }}
  volumes:
  - name: monitoring-tls-certs
    secret:
      secretName: data-science-collector-monitoring-tls
  - name: otlp-tls-certs
    secret:
      secretName: data-science-collector-collector-headless-tls
  {{- if .MetricsStorage }}
  - name: tls-certs
    secret:
      secretName: data-science-collector-tls
  {{- end }}
  config:
    extensions:
      bearertokenauth:
        filename: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    receivers:
      prometheus/self:
        config:
          scrape_configs:
            - job_name: 'otel-collector-internal'
              scrape_interval: 30s
              static_configs:
              - targets: ['127.0.0.1:8888']
      {{- if .Metrics }}
      {{- if and .AcceleratorMetrics .BuiltinDCGMScrapeEnabled }}
      prometheus:
        config:
          scrape_configs:
            - job_name: 'dcgm-exporter-accelerator-metrics'
              scheme: http
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - nvidia-gpu-operator
              metrics_path: /metrics
              relabel_configs:
                - action: keep
                  regex: ^nvidia-dcgm-exporter.*$
                  source_labels: [__meta_kubernetes_pod_name]
                - action: replace
                  regex: '([^:]+)(?::\d+)?'
                  replacement: '$1:9400'
                  source_labels: [__address__]
                  target_label: __address__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
                - action: replace
                  source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: component
                - action: replace
                  replacement: 'rhoai-accelerator-metrics'
                  target_label: job
              metric_relabel_configs:
                # Preserve canonical DCGM names for compatibility with NVIDIA dashboards and queries.
                - source_labels: [__name__]
                  regex: '(DCGM_FI_DEV_GPU_TEMP|DCGM_FI_DEV_GPU_UTIL|DCGM_FI_PROF_GR_ENGINE_ACTIVE|DCGM_FI_DEV_MEM_COPY_UTIL|DCGM_FI_DEV_FB_USED|DCGM_FI_DEV_FB_FREE|DCGM_FI_DEV_POWER_USAGE|DCGM_FI_DEV_SM_CLOCK|DCGM_FI_DEV_MEM_CLOCK)'
                  action: keep
              scrape_interval: 30s
              scrape_timeout: 10s
      {{- else }}
      # TargetAllocator supplies selected monitor scrapes. Leave its receiver
      # config absent; a present config block requires scrape_configs. The
      # target_allocator block keeps the receiver non-null for operator validation.
      prometheus:
        target_allocator: {}
      {{- end }}
      {{- end }}
      otlp:
        protocols:
          grpc:
            tls:
              cert_file: "/etc/otel-collector/otlp-tls/tls.crt"
              key_file: "/etc/otel-collector/otlp-tls/tls.key"
              min_version: "1.2"
              reload_interval: 5m
          http:
            tls:
              cert_file: "/etc/otel-collector/otlp-tls/tls.crt"
              key_file: "/etc/otel-collector/otlp-tls/tls.key"
              min_version: "1.2"
              reload_interval: 5m
    processors:
      memory_limiter:
        check_interval: 1s
        spike_limit_mib: 800
        limit_mib: 4000
      batch:
        send_batch_size: 10000
      k8sattributes: {}
      # OTLP pushers control the resource attributes they send, so the OTLP
      # pipeline must never take pod identity from them: associate pods from
      # the network connection (the collector's own view). The default
      # association order would otherwise consult client-supplied
      # k8s.pod.ip and host.name attributes first.
      k8sattributes/otlp:
        pod_association:
          - sources:
              - from: connection
      resourcedetection:
        detectors: [openshift]
      transform/gpu_metrics:
        error_mode: propagate
        metric_statements:
          - context: datapoint
            statements:
              - set(datapoint.value_double, datapoint.value_double / 100) where metric.name == "DCGM_FI_DEV_GPU_UTIL"
              - set(datapoint.value_double, datapoint.value_double / 100) where metric.name == "DCGM_FI_DEV_MEM_COPY_UTIL"
      # Workloads control their exposition labels and pushed metric
      # attributes, so a datapoint attribute named k8s_namespace_name or
      # k8s_pod_name must never be trusted: the collector ServiceMonitor
      # promotes those labels to namespace/pod for namespace-restricted
      # queries. Strip them here so collector-side enrichment (k8sattributes
      # pod association and/or the prometheus receiver's Kubernetes discovery
      # mapping, depending on scrape path and collector version) is the sole
      # source. If enrichment fails, the labels are absent and the series
      # stay under the monitoring namespace: fail-closed.
      transform/sanitize_k8s_labels:
        error_mode: propagate
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(attributes, "k8s_namespace_name")
              - delete_key(attributes, "k8s_pod_name")
      # Monitor relabelings can set the job target label, which the Prometheus
      # receiver maps to service.name; that name alone is not trusted. Only
      # exclude exporter identity when Kubernetes enrichment identifies the
      # target in nvidia-gpu-operator. Those attributes identify the exporter
      # pod, not the workload consuming the GPU (that attribution already
      # reaches Prometheus as exported_namespace/exported_pod). Removing them
      # makes the ServiceMonitor promotion a no-op for accelerator series,
      # while node/component remain for Korrel8r. Delete pod first because the
      # namespace guard on the next statement still needs k8s.namespace.name.
      # This transform stays in the scrape pipeline; OTLP pushers use a
      # separate sanitizer and cannot opt out of pod attribution this way.
      transform/exclude_dcgm_k8s_labels:
        error_mode: propagate
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.pod.name") where attributes["service.name"] == "rhoai-accelerator-metrics" and attributes["k8s.namespace.name"] == "nvidia-gpu-operator"
              - delete_key(attributes, "k8s.namespace.name") where attributes["service.name"] == "rhoai-accelerator-metrics" and attributes["k8s.namespace.name"] == "nvidia-gpu-operator"
      # OTLP pushers also control their resource attributes, and
      # k8sattributes only fills absent/empty attributes, so client-supplied
      # identity attributes would survive enrichment and poison the labels
      # the ServiceMonitor promotes to namespace/pod. Strip every spelling
      # of the promoted pair (dotted semconv and the underscored form the
      # exporter's resource_to_telemetry_conversion emits) plus the
      # attributes used as association/enrichment hints (pod uid/ip/start
      # time, node, deployment, container identity) before enrichment runs,
      # in the metrics/otlp pipeline only. Trusted association then refills
      # the real values; if association fails they stay absent: fail-closed.
      # The datapoint block also strips the bare and exported_-prefixed
      # identity label spellings: without it a pusher could still forge the
      # exported_namespace/exported_pod labels downstream scrapes preserve
      # for workload exposition (Korrel8r correlates by those). The
      # prometheus scrape path is unaffected: its k8s attributes come from
      # Kubernetes discovery metadata the target allocator controls, and its
      # workload-exposition labels must keep flowing.
      transform/sanitize_otlp_identity:
        error_mode: propagate
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.namespace.name")
              - delete_key(attributes, "k8s.pod.name")
              - delete_key(attributes, "k8s.pod.uid")
              - delete_key(attributes, "k8s.pod.ip")
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "k8s.node.name")
              - delete_key(attributes, "k8s.deployment.name")
              - delete_key(attributes, "k8s.container.name")
              - delete_key(attributes, "container.id")
              - delete_key(attributes, "k8s_namespace_name")
              - delete_key(attributes, "k8s_pod_name")
              - delete_key(attributes, "namespace")
              - delete_key(attributes, "pod")
              - delete_key(attributes, "exported_namespace")
              - delete_key(attributes, "exported_pod")
          - context: datapoint
            statements:
              - delete_key(attributes, "namespace")
              - delete_key(attributes, "pod")
              - delete_key(attributes, "exported_namespace")
              - delete_key(attributes, "exported_pod")
    exporters:
      prometheus/monitoring:
        endpoint: 0.0.0.0:8890
        tls:
          cert_file: "/etc/otel-collector/monitoring-tls/tls.crt"
          key_file: "/etc/otel-collector/monitoring-tls/tls.key"
      {{- if .Metrics }}
      {{- if .MetricsStorage }}
      prometheus:
        endpoint: 0.0.0.0:8889
        tls:
          cert_file: "/etc/otel-collector/tls/tls.crt"
          key_file: "/etc/otel-collector/tls/tls.key"
        resource_to_telemetry_conversion:
          enabled: true # by default resource attributes are dropped
      {{- end }}
      {{- if .MetricsExporterNames }}
      {{- range .MetricsExporterNames }}
      {{ . }}:
{{ index $.MetricsExporters . | indent 8 }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Traces }}
      {{- if .TempoStorage }}
      otlp/tempo:
        # In multitenancy/openshift mode, traces are always sent through the gateway
        # which uses TLS (service-CA signed cert) and requires bearer token auth.
        endpoint: {{.TempoEndpoint}}
        tls:
          ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
        auth:
          authenticator: bearertokenauth
        headers:
          # must be set to the tenant name from tempo CR
          X-Scope-OrgID: {{ .Namespace }}
      {{- end }}
      {{- if .TracesExporterNames }}
      {{- range .TracesExporterNames }}
      {{ . }}:
{{ index $.TracesExporters . | indent 8 }}
      {{- end }}
      {{- end }}
      {{ end }}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: '127.0.0.1'
                    port: 8888
      extensions: [bearertokenauth]
      pipelines:
        metrics/internal:
          receivers: [prometheus/self]
          exporters: [prometheus/monitoring]
      {{- if .Traces }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [{{- if .TempoStorage }}otlp/tempo{{- if .TracesExporterNames }}, {{ end }}{{- end }}{{- range $i, $name := .TracesExporterNames }}{{- if $i }}, {{ end }}{{ $name }}{{- end }}]
      {{- end }}
      {{- if .Metrics }}
        metrics/scrape:
          receivers: [prometheus]
          processors: [memory_limiter, k8sattributes, transform/sanitize_k8s_labels, transform/exclude_dcgm_k8s_labels, resourcedetection, transform/gpu_metrics, batch]
          exporters: [{{- if .MetricsStorage }}prometheus{{- if .MetricsExporterNames }}, {{ end }}{{- end }}{{- range $i, $name := .MetricsExporterNames }}{{- if $i }}, {{ end }}{{ $name }}{{- end }}]
        # OTLP metrics enter through a dedicated pipeline so client-supplied
        # identity attributes can be stripped before trusted, connection-based
        # enrichment (see transform/sanitize_otlp_identity and
        # k8sattributes/otlp). Scrape metadata must not pass through that
        # sanitizer, and pushed metrics must not bypass it.
        metrics/otlp:
          receivers: [otlp]
          processors: [memory_limiter, transform/sanitize_otlp_identity, k8sattributes/otlp, transform/sanitize_k8s_labels, resourcedetection, transform/gpu_metrics, batch]
          exporters: [{{- if .MetricsStorage }}prometheus{{- if .MetricsExporterNames }}, {{ end }}{{- end }}{{- range $i, $name := .MetricsExporterNames }}{{- if $i }}, {{ end }}{{ $name }}{{- end }}]
      {{- end }}
