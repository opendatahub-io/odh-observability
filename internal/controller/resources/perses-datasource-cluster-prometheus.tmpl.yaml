# OCP admin / cluster-wide Prometheus (:9091). Not the 99814 DS scoping lane.
# Caller token, no shared SA. default:false so DS proxy remains default.
apiVersion: perses.dev/{{.PersesAPIVersion}}
kind: PersesDatasource
metadata:
  name: cluster-prometheus-datasource
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
  annotations:
    platform.opendatahub.io/description: "Cluster-wide Prometheus metrics via OpenShift Monitoring Thanos Querier (caller token)"
spec:
  client:
    tls:
      enable: true
      caCert:
        type: configmap
        namespace: {{.Namespace}}
        name: prometheus-web-tls-ca
        certPath: service-ca.crt
  config:
    default: false
    display:
      name: "Cluster Prometheus"
      description: "OpenShift Monitoring Thanos Querier - cluster-wide metrics (caller token, no shared SA)"
    plugin:
      kind: "PrometheusDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            secret: cluster-prometheus-datasource-secret
            url: https://thanos-querier.openshift-monitoring.svc:9091
