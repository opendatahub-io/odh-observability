apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-lokistack-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
    platform.opendatahub.io/component: loki-logs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lokistack
      app.kubernetes.io/instance: {{.LokiStackName}}
  policyTypes:
    - Ingress
  ingress:
    # Loki components communicate through HTTP, gRPC, and memberlist.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lokistack
              app.kubernetes.io/instance: {{.LokiStackName}}
      ports:
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 9095
        - protocol: TCP
          port: 7946
        - protocol: UDP
          port: 7946
    # Prometheus scrapes the Loki component metrics endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
      ports:
        - protocol: TCP
          port: 3100
