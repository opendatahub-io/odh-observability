---
# Ingress to the Thanos namespace-enforcing proxy:
# - OpenShift router / configured gateway (external Route traffic)
# - Perses (in-cluster dashboard queries with forwarded user tokens)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-thanos-querier-proxy-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app: data-science-thanos-querier-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
      {{ if .GatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{.GatewayNamespace}}
      {{ else }}
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      {{ end }}
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              instance: data-science-perses
              app.kubernetes.io/name: data-science-perses
      ports:
        - protocol: TCP
          port: 8443
