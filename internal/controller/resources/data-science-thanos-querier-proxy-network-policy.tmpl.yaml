---
# Only the OpenShift router may reach the externally exposed Thanos proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-thanos-querier-proxy-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app: data-science-thanos-querier-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8443
