# The OpenTelemetry Operator's TargetAllocator NetworkPolicy is disabled with
# the collector policy. This module owns the replacement so TargetAllocator
# ingress is limited to the collector and API-server egress remains explicit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-collector-targetallocator-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-targetallocator
      app.kubernetes.io/instance: {{.Namespace}}.data-science-collector
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: {{.Namespace}}.data-science-collector
              app.kubernetes.io/managed-by: opentelemetry-operator
              app.kubernetes.io/part-of: opentelemetry
      ports:
        - protocol: TCP
          port: 8080
        # TargetAllocator Service HTTPS port 443 maps to this mTLS listener.
        - protocol: TCP
          port: 8443
  {{ if .Korrel8rAPIServerCIDRs }}
  egress:
    - to:
      {{ range .Korrel8rAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
      {{ end }}
      ports:
        - protocol: TCP
          port: 6443
  {{ else }}
  egress: []
  {{ end }}
