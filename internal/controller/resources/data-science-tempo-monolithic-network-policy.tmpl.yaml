apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-tempomonolithic-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo-monolithic
      app.kubernetes.io/instance: data-science-tempomonolithic
  policyTypes:
    - Ingress
  ingress:
    # The monitoring collector sends OTLP traces to the Tempo gateway.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: {{.Namespace}}.data-science-collector
              app.kubernetes.io/managed-by: opentelemetry-operator
              app.kubernetes.io/part-of: opentelemetry
      ports:
        # The Tempo gateway Service exposes OTLP gRPC on 4317 and forwards it
        # to the gateway container's grpc-public port (8090). NetworkPolicy
        # ports are evaluated against the destination pod port.
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Prometheus scrapes the Tempo metrics endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
      ports:
        - protocol: TCP
          port: 3200
    # Perses reads traces through the Tempo gateway query endpoint.
    - from:
        - podSelector:
            matchLabels:
              instance: data-science-perses
              app.kubernetes.io/name: data-science-perses
      ports:
        - protocol: TCP
          port: 8080
