apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-collector-monitoring-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: {{.Namespace}}.data-science-collector
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
      ports:
        - protocol: TCP
          port: 8889
        - protocol: TCP
          port: 8890
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{.Namespace}}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
