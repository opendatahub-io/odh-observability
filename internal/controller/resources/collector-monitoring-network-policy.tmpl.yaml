# This is the only NetworkPolicy that selects the collector pods, so it acts as
# the collector's sole ingress gate: on clusters with NetworkPolicy enforcement,
# any ingress not listed below is denied. Prometheus is the only caller of the
# collector's monitoring endpoints, while OTLP is limited to enrolled namespaces
# and the stable labels used by instrumented KServe InferenceService and
# LLMInferenceService workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-science-collector-monitoring-ingress
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: {{.Namespace}}.data-science-collector
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: data-science-monitoringstack
      ports:
        - protocol: TCP
          port: 8889
        - protocol: TCP
          port: 8890
    - from:
        - namespaceSelector:
            matchLabels:
              monitoring.opendatahub.io/otlp: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: llminferenceservice
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - llminferenceservice-workload
                  - llminferenceservice-workload-prefill
                  - llminferenceservice-workload-worker
                  - llminferenceservice-workload-leader
                  - llminferenceservice-workload-worker-prefill
                  - llminferenceservice-workload-leader-prefill
                  - llminferenceservice-router-scheduler
        - namespaceSelector:
            matchLabels:
              monitoring.opendatahub.io/otlp: "true"
          podSelector:
            matchExpressions:
              - key: serving.kserve.io/inferenceservice
                operator: Exists
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
