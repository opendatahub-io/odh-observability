---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{.UsageLogsCollectorName}}-processor
  labels:
    platform.opendatahub.io/component: loki-usage-logs
rules:
  # Required for k8sattributes processor
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["loki.grafana.com"]
    resources:
      - application
    resourceNames:
      - logs
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{.UsageLogsCollectorName}}-processor
  labels:
    platform.opendatahub.io/component: loki-usage-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{.UsageLogsCollectorName}}-processor
subjects:
  - kind: ServiceAccount
    name: {{.UsageLogsCollectorName}}-collector
    namespace: {{.Namespace}}
---
