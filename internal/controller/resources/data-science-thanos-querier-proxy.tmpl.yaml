---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-science-thanos-querier-proxy
  namespace: {{.Namespace}}
  labels:
    app: data-science-thanos-querier-proxy
    platform.opendatahub.io/part-of: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-thanos-querier-proxy
  labels:
    platform.opendatahub.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: data-science-thanos-querier-proxy
    namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-thanos-querier-proxy-auth-delegator
  labels:
    platform.opendatahub.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: data-science-thanos-querier-proxy
    namespace: {{.Namespace}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-science-thanos-querier-proxy-config
  namespace: {{.Namespace}}
  labels:
    app: data-science-thanos-querier-proxy
    platform.opendatahub.io/part-of: monitoring
data:
  kube-rbac-proxy.yaml: |
    # Authenticate the caller and authorize access to the namespace selected by
    # the query parameter before forwarding the request to Thanos.
    authorization:
      rewrites:
        byQueryParameter:
          name: "namespace"
      resourceAttributes:
        apiGroup: metrics.k8s.io
        resource: pods
        namespace: "{{ "{{ .Value }}" }}"
---
# REQUIRED QUERY FORMAT: /api/v1/query?query=<promql>&namespace=<namespace-name>
#
# kube-rbac-proxy authenticates the caller and performs the namespace SAR. The
# label proxy then constrains the PromQL query so a caller cannot use a valid
# namespace parameter to retrieve another namespace's series.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-science-thanos-querier-proxy
  namespace: {{.Namespace}}
  labels:
    app: data-science-thanos-querier-proxy
    platform.opendatahub.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-science-thanos-querier-proxy
  template:
    metadata:
      labels:
        app: data-science-thanos-querier-proxy
    spec:
      serviceAccountName: data-science-thanos-querier-proxy
      containers:
        - name: kube-rbac-proxy
          image: {{.KubeRBACProxyImage}}
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:9091/
            - --config-file=/etc/kube-rbac-proxy/kube-rbac-proxy.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --tls-min-version={{.TLSMinVersion}}
            {{- if .TLSCipherSuites}}
            - --tls-cipher-suites={{.TLSCipherSuites}}
            {{- end}}
            - --logtostderr=true
            - --v=2
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
        - name: prom-label-proxy
          image: {{.PromLabelProxyImage}}
          args:
            - --insecure-listen-address=127.0.0.1:9091
            - --upstream=http://thanos-querier-data-science-thanos-querier.{{.Namespace}}.svc.cluster.local:10902
            - --label=namespace
            - --enable-label-apis
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: data-science-thanos-querier-proxy-config
        - name: tls
          secret:
            secretName: data-science-thanos-querier-proxy-tls
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: data-science-thanos-querier-proxy
  namespace: {{.Namespace}}
  labels:
    app: data-science-thanos-querier-proxy
    platform.opendatahub.io/part-of: monitoring
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: data-science-thanos-querier-proxy-tls
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  selector:
    app: data-science-thanos-querier-proxy
