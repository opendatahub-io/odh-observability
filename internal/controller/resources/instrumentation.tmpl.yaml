apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: data-science-instrumentation
  namespace: {{.Namespace}}
spec:
  exporter:
    endpoint: {{.OtlpEndpoint}}
    tls:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  sampler:
    type: traceidratio
    argument: "{{.SampleRatio}}"
