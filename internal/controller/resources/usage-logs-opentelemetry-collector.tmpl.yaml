apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{.UsageLogsCollectorName}}
  namespace: {{.Namespace}}
  labels:
    app.kubernetes.io/part-of: data-science-observability
spec:
  mode: deployment
  replicas: {{.CollectorReplicas}}  
  resources:
    limits:
      cpu: {{.CollectorCPULimit}}
      memory: {{.CollectorMemoryLimit}}
    requests:
      cpu: {{.CollectorCPURequest}}
      memory: {{.CollectorMemoryRequest}}

  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: '0.0.0.0:4317'
          http:
            endpoint: '0.0.0.0:4318'

    processors:
      # 1. Protect pod against OOM kills under heavy log spikes
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

      # 2. Add resource attributes
      resource:
        attributes:
          - action: upsert
            key: log_type
            value: application
          - action: upsert
            key: kubernetes_namespace_name
            from_attribute: service.namespace

      # 3. Generically strip leading/trailing quotes from ALL attribute values
      # also sets the k8s pod ip resource attribute tobe accessed later and provide addional k8s context to the log - whilst not being whiltelsited strema label in loki
      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["k8s.pod.ip"], Split(attributes["upstream_host"], ":")[0]) where attributes["upstream_host"] != nil
              - replace_all_patterns(attributes, "value", "^\"|\"$", "")

      # 4. Enrich logs with Kubernetes pod/node/deployment metadata
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
        pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip


      # 5. Group logs by core attributes
      groupbyattrs/maas:
        keys:
          - model
          - subscription
          - response_type

      # 6. Batch logs for optimal export performance
      batch: {}

    exporters:
{{- if .UsageLogs}}
      otlphttp/loki:
        endpoint: {{.UsageLogsEndpoint}}
        tls:
          ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
        auth:
          authenticator: bearertokenauth
        headers:
          "X-Scope-OrgID": "application"
{{- end}}

    service:
      extensions: [bearertokenauth]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: '0.0.0.0'
                    port: 8888

      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, transform, k8sattributes, groupbyattrs/maas, batch]
          exporters:
{{- if .UsageLogs}}
            - otlphttp/loki
{{- end}}
