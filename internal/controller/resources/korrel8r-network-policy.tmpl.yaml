apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{.Korrel8rServiceName}}
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
  annotations:
    # Informational contract only: host-network API-server traffic is outside
    # this workload policy and must be covered or qualified by the cluster platform.
    platform.opendatahub.io/api-server-access: endpoint-slice-addresses
    platform.opendatahub.io/api-server-node-source: explicit-exception
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{.Korrel8rServiceName}}
  policyTypes:
    - Ingress
    - Egress
  # No stable in-cluster caller is owned or exposed by this module. Keep the
  # query service ingress-denied until an approved caller has stable labels.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 5353
    {{ if .Korrel8rAPIServerCIDRs }}
    - to:
      {{ range .Korrel8rAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
      {{ end }}
      ports:
        - protocol: TCP
          port: 6443
    {{ end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{.Namespace}}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10902
