apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: {{.ClusterLogForwarderName}}
  namespace: {{.ClusterLoggingNamespace}}
  labels:
    platform.opendatahub.io/component: loki-logs
spec:
  serviceAccount:
    name: {{.ClusterLogForwarderServiceAccount}}
  inputs:
  - name: inference-app-logs
    type: application
    application:
      includes:
{{- if .InferenceNamespaces}}
{{- range .InferenceNamespaces}}
      - namespace: {{.}}
{{- end}}
{{- else}}
      - namespace: {{.Namespace}}
{{- end}}
  outputs:
  - name: data-science-lokistack
    type: lokiStack
    lokiStack:
      target:
        name: {{.LokiStackName}}
        namespace: {{.Namespace}}
      authentication:
        token:
          from: serviceAccount
    tls:
      ca:
        configMapName: openshift-service-ca.crt
        key: service-ca.crt
  pipelines:
  - name: inference-logs-to-loki
    inputRefs:
    - inference-app-logs
    outputRefs:
    - data-science-lokistack
