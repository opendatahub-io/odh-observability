---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.ClusterLogForwarderServiceAccount}}
  namespace: {{.ClusterLoggingNamespace}}
  labels:
    platform.opendatahub.io/component: loki-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{.ClusterLogForwarderServiceAccount}}-collect-app-logs
  labels:
    platform.opendatahub.io/component: loki-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: {{.ClusterLogForwarderServiceAccount}}
    namespace: {{.ClusterLoggingNamespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{.ClusterLogForwarderServiceAccount}}-loki-writer
  labels:
    platform.opendatahub.io/component: loki-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-write-application-logs
subjects:
  - kind: ServiceAccount
    name: {{.ClusterLogForwarderServiceAccount}}
    namespace: {{.ClusterLoggingNamespace}}
