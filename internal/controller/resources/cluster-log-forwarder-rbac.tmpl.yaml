---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.ClusterLogForwarderServiceAccount}}
  namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{.ClusterLogForwarderServiceAccount}}-collect-app-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: {{.ClusterLogForwarderServiceAccount}}
    namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{.ClusterLogForwarderServiceAccount}}-loki-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-write-application-logs
subjects:
  - kind: ServiceAccount
    name: {{.ClusterLogForwarderServiceAccount}}
    namespace: {{.Namespace}}
