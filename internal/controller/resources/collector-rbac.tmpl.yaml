{{ if .Metrics }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.TargetAllocatorServiceAccount}}
  namespace: {{.Namespace}}
{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: generate-processors-role
rules:
- apiGroups:
  - ""
  - config.openshift.io
  resources:
  - pods
  - namespaces
  - infrastructures
  - infrastructures/status
  - services
  - endpoints
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  - servicemonitors
  - probes
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: generate-processors-collector-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: generate-processors-role
subjects:
- kind: ServiceAccount
  name: data-science-collector-collector
  namespace: {{.Namespace}}
{{ if .Metrics }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: generate-processors-targetallocator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: generate-processors-role
subjects:
- kind: ServiceAccount
  name: {{.TargetAllocatorServiceAccount}}
  namespace: {{.Namespace}}
{{ range .TargetAllocatorSecretNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-science-collector-targetallocator-secrets
  namespace: {{ . }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-science-collector-targetallocator-secrets
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-science-collector-targetallocator-secrets
subjects:
- kind: ServiceAccount
  name: {{ $.TargetAllocatorServiceAccount }}
  namespace: {{ $.Namespace }}
{{ end }}
{{ end }}
