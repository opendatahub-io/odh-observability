{{ if .Metrics }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.TargetAllocatorServiceAccount}}
  namespace: {{.Namespace}}
{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: generate-processors-role
rules:
- apiGroups:
  - ""
  - config.openshift.io
  resources:
  - pods
  - namespaces
  - infrastructures
  - infrastructures/status
  - services
  - endpoints
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  - servicemonitors
  - probes
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: generate-processors-collector-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: generate-processors-role
subjects:
- kind: ServiceAccount
  name: data-science-collector-collector
  namespace: {{.Namespace}}
{{ if .Metrics }}
---
# Keep this legacy binding and roleRef. ClusterRoleBinding.roleRef is immutable,
# so changing it would break upgrades of installations created before the
# dedicated TargetAllocator role was introduced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: generate-processors-targetallocator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: generate-processors-role
subjects:
- kind: ServiceAccount
  name: {{.TargetAllocatorServiceAccount}}
  namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: generate-processors-targetallocator-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  - nodes
  - nodes/metrics
  - services
  - endpoints
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  - servicemonitors
  - scrapeconfigs
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - monitoring.coreos.com
  resources:
  - probes
  verbs:
  - get
  - watch
  - list
- nonResourceURLs:
  - /metrics
  - /api
  - /api/*
  - /apis
  - /apis/*
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: generate-processors-targetallocator-discovery-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: generate-processors-targetallocator-role
subjects:
- kind: ServiceAccount
  name: {{.TargetAllocatorServiceAccount}}
  namespace: {{.Namespace}}
{{ if not (index . "RBACScoperEnabled") }}
{{ range .TargetAllocatorSecretNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-science-collector-targetallocator-secrets
  namespace: {{ . }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-science-collector-targetallocator-secrets
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-science-collector-targetallocator-secrets
subjects:
- kind: ServiceAccount
  name: {{ $.TargetAllocatorServiceAccount }}
  namespace: {{ $.Namespace }}
{{ end }}
{{ end }}
{{ end }}
