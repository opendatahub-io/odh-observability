apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.Korrel8rServiceName}}-config
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/part-of: monitoring
data:
  rhai-inference-rules.yaml: |
    # These rules bridge RHOAI-specific resources to Korrel8r's built-in
    # Kubernetes, metric, log, and trace correlation rules. Query templates
    # intentionally emit no query when their required relationship is absent.
    rules:
      - name: LLMInferenceServiceToServingPods
        start:
          domain: k8s
          classes:
            - LLMInferenceService.v1alpha2.serving.kserve.io
        goal:
          domain: k8s
          classes:
            - Pod
        result:
          query: |-
            {{"{{"}}- with index .metadata "namespace" {{"}}"}}
            {{"{{"}}- $namespace := . {{"}}"}}
            {{"{{"}}- with index $.metadata "name" {{"}}"}}
            k8s:Pod:{"namespace":"{{"{{"}}$namespace{{"}}"}}","labels":{"app.kubernetes.io/name":"{{"{{"}}.{{"}}"}}","app.kubernetes.io/part-of":"llminferenceservice"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
      - name: HTTPRouteToBackendService
        start:
          domain: k8s
          classes:
            - HTTPRoute.v1.gateway.networking.k8s.io
        goal:
          domain: k8s
          classes:
            - Service
        result:
          query: |-
            {{"{{"}}- with index .metadata "namespace" {{"}}"}}
            {{"{{"}}- $routeNamespace := . {{"}}"}}
            {{"{{"}}- with index $ "spec" {{"}}"}}
            {{"{{"}}- range index . "rules" {{"}}"}}
            {{"{{"}}- range (index . "backendRefs") {{"}}"}}
            {{"{{"}}- $name := index . "name" {{"}}"}}
            {{"{{"}}- $kind := index . "kind" {{"}}"}}
            {{"{{"}}- $group := index . "group" {{"}}"}}
            {{"{{"}}- if and $name (or (not $kind) (eq $kind "Service")) (or (not $group) (eq $group "")) {{"}}"}}
            {{"{{"}}- $namespace := index . "namespace" {{"}}"}}
            k8s:Service:{"namespace":"{{"{{"}}if $namespace{{"}}"}}{{"{{"}}$namespace{{"}}"}}{{"{{"}}else{{"}}"}}{{"{{"}}$routeNamespace{{"}}"}}{{"{{"}}end{{"}}"}}","name":"{{"{{"}}$name{{"}}"}}"}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
      - name: HTTPRouteToInferencePool
        start:
          domain: k8s
          classes:
            - HTTPRoute.v1.gateway.networking.k8s.io
        goal:
          domain: k8s
          classes:
            - InferencePool.v1.inference.networking.k8s.io
        result:
          query: |-
            {{"{{"}}- with index .metadata "namespace" {{"}}"}}
            {{"{{"}}- $routeNamespace := . {{"}}"}}
            {{"{{"}}- with index $ "spec" {{"}}"}}
            {{"{{"}}- range index . "rules" {{"}}"}}
            {{"{{"}}- range index . "backendRefs" {{"}}"}}
            {{"{{"}}- $name := index . "name" {{"}}"}}
            {{"{{"}}- $kind := index . "kind" {{"}}"}}
            {{"{{"}}- $group := index . "group" {{"}}"}}
            {{"{{"}}- if and $name (eq $kind "InferencePool") (eq $group "inference.networking.x-k8s.io") {{"}}"}}
            {{"{{"}}- $namespace := index . "namespace" {{"}}"}}
            k8s:InferencePool.v1.inference.networking.k8s.io:{"namespace":"{{"{{"}}if $namespace{{"}}"}}{{"{{"}}$namespace{{"}}"}}{{"{{"}}else{{"}}"}}{{"{{"}}$routeNamespace{{"}}"}}{{"{{"}}end{{"}}"}}","name":"{{"{{"}}$name{{"}}"}}"}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
      - name: InferencePoolToServingPods
        start:
          domain: k8s
          classes:
            - InferencePool.v1.inference.networking.k8s.io
        goal:
          domain: k8s
          classes:
            - Pod
        result:
          query: |-
            {{"{{"}}- with index .metadata "namespace" {{"}}"}}
            {{"{{"}}- $namespace := . {{"}}"}}
            {{"{{"}}- with index $ "spec" {{"}}"}}
            {{"{{"}}- with index . "selector" {{"}}"}}
            {{"{{"}}- with index . "matchLabels" {{"}}"}}
            {{"{{"}}- $labels := . {{"}}"}}
            {{"{{"}}- with index $labels "app.kubernetes.io/name" {{"}}"}}
            {{"{{"}}- $name := . {{"}}"}}
            {{"{{"}}- with index $labels "app.kubernetes.io/part-of" {{"}}"}}
            {{"{{"}}- $partOf := . {{"}}"}}
            {{"{{"}}- with index $labels "kserve.io/component" {{"}}"}}
            k8s:Pod:{"namespace":"{{"{{"}}$namespace{{"}}"}}","labels":{"app.kubernetes.io/name":"{{"{{"}}$name{{"}}"}}","app.kubernetes.io/part-of":"{{"{{"}}$partOf{{"}}"}}","kserve.io/component":"{{"{{"}}.{{"}}"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
            {{"{{"}}- end {{"}}"}}
  korrel8r.yaml: |
    stores:
      - domain: k8s
{{- if .MetricsStorage}}
      - domain: metric
        metric: {{.ThanosQuerierEndpoint}}
{{- end}}
{{- if .TempoStorage}}
      - domain: trace
        tempoStack: {{.TempoQueryEndpoint}}/api/search
        certificateAuthority: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
{{- end}}
{{- if .Logs}}
      - domain: log
        lokiStack: {{.LokiQueryEndpoint}}
        direct: true
        certificateAuthority: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
{{- end}}
    include:
      - /etc/korrel8r/rules/all.yaml
{{- if .MetricsStorage}}
      - /etc/korrel8r/custom/rhoai-metrics.yaml
{{- end}}
      - /etc/korrel8r/custom/rhai-inference-rules.yaml
    tuning:
      requestTimeout: {{.Korrel8rRequestTimeout}}
      sessionTimeout: {{.Korrel8rSessionTimeout}}
{{- if .MetricsStorage}}
  rhoai-metrics.yaml: |
    rules:
      - name: PodToRHOAIMetric
        start:
          domain: k8s
          classes: [Pod]
        goal:
          domain: metric
        result:
          query: |-
            metric:metric:{exported_namespace="{{ "{{" }}.metadata.namespace{{ "}}" }}",exported_pod="{{ "{{" }}.metadata.name{{ "}}" }}"}
{{- end}}
