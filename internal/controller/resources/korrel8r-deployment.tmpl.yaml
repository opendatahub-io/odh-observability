apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Korrel8rServiceName}}
  namespace: {{.Namespace}}
  labels:
    app.kubernetes.io/name: {{.Korrel8rServiceName}}
    app.kubernetes.io/component: correlation
    app.kubernetes.io/part-of: monitoring
    platform.opendatahub.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{.Korrel8rServiceName}}
  template:
    metadata:
      annotations:
        platform.opendatahub.io/korrel8r-config-checksum: {{.Korrel8rConfigChecksum}}
      labels:
        app.kubernetes.io/name: {{.Korrel8rServiceName}}
        app.kubernetes.io/component: correlation
        app.kubernetes.io/part-of: monitoring
        platform.opendatahub.io/part-of: monitoring
    spec:
      serviceAccountName: {{.Korrel8rServiceName}}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{.Korrel8rServiceName}}
          image: {{.Korrel8rImage}}
          imagePullPolicy: IfNotPresent
          command:
            - korrel8r
          args:
            - web
            - --https=:8443
            - --cert=/var/run/tls/server/tls.crt
            - --key=/var/run/tls/server/tls.key
            - --rest=true
            - --mcp=false
            - --unsafe-shared-session=false
            - --config=/etc/korrel8r/custom/korrel8r.yaml
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: {{.Korrel8rCPURequest}}
              memory: {{.Korrel8rMemoryRequest}}
            limits:
              cpu: {{.Korrel8rCPULimit}}
              memory: {{.Korrel8rMemoryLimit}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/korrel8r/custom
              readOnly: true
            - name: tls
              mountPath: /var/run/tls/server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{.Korrel8rServiceName}}-config
        - name: tls
          secret:
            secretName: {{.Korrel8rServiceName}}-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Korrel8rServiceName}}
  namespace: {{.Namespace}}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{.Korrel8rServiceName}}-tls
  labels:
    app.kubernetes.io/name: {{.Korrel8rServiceName}}
    app.kubernetes.io/component: correlation
    app.kubernetes.io/part-of: monitoring
    platform.opendatahub.io/part-of: monitoring
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{.Korrel8rServiceName}}
