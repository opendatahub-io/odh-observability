# Namespace-scoped Prometheus proxy.
#
# Only GET and HEAD are allowed. A method-gate sidecar sits between
# kube-rbac-proxy and prom-label-proxy and returns 403 for every other method
# BEFORE the request reaches prom-label-proxy. The gate runs the operator's own
# image ("manager method-gate" subcommand), so no extra container image has to be
# shipped or mirrored for disconnected installs. This enforcement is independent
# of RBAC: even if a role were ever to grant users "create" on
# metrics.k8s.io/pods (which would make kube-rbac-proxy authorize a POST), the
# gate still rejects the request.
#
# Why this matters: prom-label-proxy's --query-param uses ParseForm, which
# merges the URL query AND the POST body. Without the gate, a POST body
# "namespace" value could be OR'd into the enforced label matcher
# (namespace=~"authorized|attacker") even though kube-rbac-proxy only authorized
# the URL-query namespace. Dropping non-GET/HEAD methods removes that vector at
# the proxy layer. RBAC (no "create" grant) remains as defense in depth.
#
# Request path: kube-rbac-proxy (:8443, authn/authz) -> method-gate (:9092,
# GET/HEAD only) -> prom-label-proxy (:9091, label enforcement) -> Prometheus.
#
# Clients must use GET with the namespace in the URL query:
#   /api/v1/query?query=<promql>&namespace=<namespace-name>
# GET maps to the "get" verb, which OpenShift's built-in view/edit/admin roles
# already grant on metrics.k8s.io/pods.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-science-prometheus-namespace-proxy
  namespace: {{.Namespace}}
  labels:
    app: data-science-prometheus-namespace-proxy
    platform.opendatahub.io/part-of: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-prometheus-namespace-proxy
  labels:
    platform.opendatahub.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: data-science-prometheus-namespace-proxy
    namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-prometheus-namespace-proxy-auth-delegator
  labels:
    platform.opendatahub.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: data-science-prometheus-namespace-proxy
    namespace: {{.Namespace}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-science-prometheus-namespace-proxy-config
  namespace: {{.Namespace}}
  labels:
    app: data-science-prometheus-namespace-proxy
    platform.opendatahub.io/part-of: monitoring
data:
  kube-rbac-proxy.yaml: |
    # See kube-rbac-proxy authorization configuration with namespace restriction doc for implementation, troubleshooting and usage examples:
    # docs/NAMESPACE_RESTRICTED_METRICS.md
    authorization:
      rewrites:
        byQueryParameter:
          name: "namespace"
      resourceAttributes:
        apiGroup: metrics.k8s.io
        resource: pods
        namespace: "{{ "{{ .Value }}" }}"
---
#
# REQUIRED QUERY FORMAT: /api/v1/query?query=<promql>&namespace=<namespace-name>
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-science-prometheus-namespace-proxy
  namespace: {{.Namespace}}
  labels:
    app: data-science-prometheus-namespace-proxy
    platform.opendatahub.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-science-prometheus-namespace-proxy
  template:
    metadata:
      labels:
        app: data-science-prometheus-namespace-proxy
    spec:
      serviceAccountName: data-science-prometheus-namespace-proxy
      containers:
        # kube-rbac-proxy for authentication and authorization
        - name: kube-rbac-proxy
          image: {{.KubeRBACProxyImage}}
          args:
            - --secure-listen-address=0.0.0.0:8443
            # Forward to the method gate (GET/HEAD only), which proxies to prom-label-proxy.
            - --upstream=http://127.0.0.1:9092/
            - --config-file=/etc/kube-rbac-proxy/kube-rbac-proxy.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --tls-min-version={{.TLSMinVersion}}
            {{- if .TLSCipherSuites}}
            - --tls-cipher-suites={{.TLSCipherSuites}}
            {{- end}}
            - --logtostderr=true
            - --v=2
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: client-ca
              mountPath: /etc/client-ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
        # Method gate: allows only GET/HEAD, rejects everything else with 403,
        # independent of RBAC, before prom-label-proxy parses the request.
        - name: method-gate
          image: {{.HTTPMethodGateImage}}
          # Runs the operator binary's "method-gate" subcommand: a minimal reverse
          # proxy that forwards only GET/HEAD to prom-label-proxy and returns 403
          # for everything else. No config file or writable filesystem needed.
          command:
            - /manager
            - method-gate
            - --listen=127.0.0.1:9092
            - --upstream=http://127.0.0.1:9091
          ports:
            - containerPort: 9092
              name: method-gate
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
        - name: prom-label-proxy
          image: {{.PromLabelProxyImage}}
          args:
            - --insecure-listen-address=127.0.0.1:9091
            - --upstream=https://prometheus-operated.{{.Namespace}}.svc:9090
            - --label=namespace
            - --query-param=namespace
            - --error-on-replace
            - --enable-label-apis
            # Reject duplicate namespace values from URL and POST form data.
            - --regex-match
          env:
            - name: SSL_CERT_DIR
              value: /etc/prometheus-tls-ca:/etc/ssl/certs:/etc/pki/tls/certs
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: prometheus-tls-ca
              mountPath: /etc/prometheus-tls-ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: data-science-prometheus-namespace-proxy-config
        - name: tls
          secret:
            secretName: data-science-prometheus-namespace-proxy-tls
        - name: client-ca
          configMap:
            name: prometheus-client-ca
            optional: true
        - name: prometheus-tls-ca
          configMap:
            name: prometheus-web-tls-ca
            items:
              - key: service-ca.crt
                path: ca.crt
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: data-science-prometheus-namespace-proxy
  namespace: {{.Namespace}}
  labels:
    app: data-science-prometheus-namespace-proxy
    platform.opendatahub.io/part-of: monitoring
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: data-science-prometheus-namespace-proxy-tls
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  selector:
    app: data-science-prometheus-namespace-proxy
