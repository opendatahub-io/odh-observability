apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: {{.LokiStackName}}
  namespace: {{.Namespace}}
  labels:
    platform.opendatahub.io/component: loki-logs
spec:
  limits:
    global:
      queries:
        queryTimeout: 3m
      otlp:
        streamLabels:
          resourceAttributes:
            - name: service.name
    tenants:
      application:
        otlp:
          streamLabels:
            resourceAttributes:
            - name: kubernetes_namespace_name
            - name: model
            - name: subscription
            - name: response_type
            - name: gateway_namespace_name
            - name: gateway_deployment_name
            - name: upstream_namespace_name
            - name: upstream_deployment_name
  managementState: Managed
  size: {{ .LogsLokiStackSize }}
  storage:
    schemas:
    - effectiveDate: "2020-10-11"
      version: v13
    secret:
      credentialMode: {{.LokiStorageCredentialMode}}
      name: {{.LokiStorageSecretName}}
      type: {{.LokiStorageType}}
  storageClassName: {{.LokiStorageClassName}}
  tenants:
    mode: openshift-logging
---
# The LokiStack gateway checks this stream permission before authorizing the
# namespace selected by the query. Aggregate it into project roles so their
# namespace RoleBindings can pass the stream check.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-science-application-logs-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    platform.opendatahub.io/part-of: monitoring
rules:
  - apiGroups: ["loki.grafana.com"]
    resources: ["application"]
    resourceNames: ["logs"]
    verbs: ["get"]
